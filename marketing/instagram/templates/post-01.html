<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OptiMax — пост 1080×1350</title>
<link rel="stylesheet" href="style.css">
<style>
  /* --- розкладка поста 4:5 --- */
  .canvas-post .inner { padding: 78px 72px 66px; }
  .canvas-post .brand { margin-bottom: 44px; }
  .canvas-post .head  { margin-bottom: 40px; }
  .canvas-post .shot-wrap {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center;
  }
  .canvas-post .shot-wrap > .shot { width: 100%; }
  .canvas-post .badges { margin-top: 38px; }
  .canvas-post .foot   { margin-top: 34px; }
</style>
</head>
<body class="post-mode">
<div class="canvas canvas-post">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
  <div class="grid"></div>
  <div class="topline"></div>

  <div class="inner">

    <header class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13 1.6 3.4 14.1H10l-1 8.5L19 10.1h-6.6L13 1.6z" fill="#ffffff"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="name">OptiMax</div>
        <div class="suite">PC Optimization Suite</div>
      </div>
      <div class="ver">v1.4.0</div>
    </header>

    <section class="head">
      <h1>Порядок і швидкість<br><span class="grad">в один клік</span></h1>
      <p class="sub">Безкоштовний оптимізатор Windows 10/11 від ER7 Studio</p>
    </section>

    <div class="shot-wrap">
      <div class="wrap-glow"></div>
      <div class="shot">
        <img src="img/app.png" alt="Головний екран OptiMax: дашборд із показниками процесора, памʼяті, дисків і чотирма профілями запуску">
      </div>
    </div>

    <ul class="badges">
      <li><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>35 задач</li>
      <li><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>3 теми</li>
      <li><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>5 мов</li>
      <li><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>100% безкоштовно</li>
    </ul>

    <footer class="foot">
      <span class="spark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 1.6 3.4 14.1H10l-1 8.5L19 10.1h-6.6L13 1.6z" fill="#fff"/></svg>
      </span>
      Створено в ER7 Studio
      <span class="tag">portable .exe · повний відкат змін</span>
    </footer>

  </div>
</div>
</body>
</html>
